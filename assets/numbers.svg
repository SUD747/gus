<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" width="860" height="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .t1 { fill: #0b0b0b; } .t2 { fill: #52514e; } .base { fill: #b5b4ae; } .gus { fill: #2a78d6; } .track { fill: #0b0b0b; fill-opacity: .06; }
    @media (prefers-color-scheme: dark) {
      .t1 { fill: #ffffff; } .t2 { fill: #c3c2b7; } .base { fill: #6b6a65; } .gus { fill: #3987e5; } .track { fill: #ffffff; fill-opacity: .08; }
    }
    .h { font-size: 15px; font-weight: 600; } .l { font-size: 13px; } .v { font-size: 13px; font-weight: 600; }
  </style>
  <title>Gus: tokens per question and how often the right code is ranked first</title>

  <!-- Left: tokens per question (scale: 6,472 tokens = 380px) -->
  <text x="0" y="24" class="h t1">Tokens the agent reads per question</text>

  <text x="0" y="62" class="l t2">Read the file that holds the answer (no Gus)</text>
  <path class="base" d="M0 70 h376 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-376 z"/>
  <text x="390" y="87" class="v t1">6,472</text>

  <text x="0" y="124" class="l t2">Gus results (default)</text>
  <path class="gus" d="M0 132 h117 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-117 z"/>
  <text x="131" y="149" class="v t1">2,059 <tspan class="t2" font-weight="400">· 68% less</tspan></text>

  <text x="0" y="186" class="l t2">Gus outline, then the chosen lines (opt-in)</text>
  <path class="gus" d="M0 194 h90 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-90 z"/>
  <text x="104" y="211" class="v t1">1,597 <tspan class="t2" font-weight="400">· 75% less</tspan></text>

  <!-- Right: hit@1 (scale: 100% = 260px) -->
  <text x="540" y="24" class="h t1">Right code ranked first</text>

  <text x="540" y="62" class="l t2">fast model (default)</text>
  <rect class="track" x="540" y="70" width="260" height="24" rx="4"/>
  <path class="gus" d="M540 70 h113 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-113 z"/>
  <text x="810" y="87" class="v t1">45%</text>

  <text x="540" y="124" class="l t2">quality model</text>
  <rect class="track" x="540" y="132" width="260" height="24" rx="4"/>
  <path class="gus" d="M540 132 h178 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-178 z"/>
  <text x="810" y="149" class="v t1">70%</text>

  <text x="540" y="211" class="l t2">33 held-out questions · httpx + ky</text>
</svg>
